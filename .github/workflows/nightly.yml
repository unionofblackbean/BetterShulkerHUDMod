name: Nightly regression

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-regression
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare nightly matrices
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.matrix.outputs.build }}
      gametest: ${{ steps.matrix.outputs.gametest }}
      compat: ${{ steps.matrix.outputs.compat }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository
        shell: pwsh
        run: |
          ./scripts/Test-VersionManifest.ps1
          ./scripts/Test-CompatibilityAnchors.ps1
      - id: matrix
        shell: pwsh
        run: |
          "build=$(./scripts/Get-CiMatrix.ps1 -Mode build)" >> $env:GITHUB_OUTPUT
          "gametest=$(./scripts/Get-CiMatrix.ps1 -Mode gametest)" >> $env:GITHUB_OUTPUT
          "compat=$(./scripts/Get-CiMatrix.ps1 -Mode compat)" >> $env:GITHUB_OUTPUT

  build:
    name: Build / ${{ matrix.id }} / Java ${{ matrix.java }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - shell: pwsh
        run: ./scripts/Build-Version.ps1 -Id '${{ matrix.id }}' -Clean

  client-gametest:
    name: Base Client GameTest / ${{ matrix.id }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.gametest) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Run dependency-clean Client GameTest
        shell: bash
        run: xvfb-run --auto-servernum pwsh -NoProfile -File scripts/Build-Version.ps1 -Id '${{ matrix.id }}' -GameTest
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-logs-${{ matrix.id }}
          path: |
            ${{ matrix.path }}/build/clientGameTest/**/*.log
            ${{ matrix.path }}/build/**/logs/**
          if-no-files-found: ignore
          retention-days: 14

  compatibility-smoke:
    name: Compatibility smoke / ${{ matrix.id }} / ${{ matrix.profile }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.compat) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Run isolated optional-Mod profile
        shell: bash
        run: xvfb-run --auto-servernum pwsh -NoProfile -File scripts/Build-Version.ps1 -Id '${{ matrix.id }}' -GameTest -CompatibilityProfile '${{ matrix.profile }}'
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compat-logs-${{ matrix.id }}-${{ matrix.profile }}
          path: |
            ${{ matrix.path }}/build/clientGameTest/**/*.log
            ${{ matrix.path }}/build/**/logs/**
          if-no-files-found: ignore
          retention-days: 14

  required:
    name: Nightly required checks
    if: always()
    needs: [prepare, build, client-gametest, compatibility-smoke]
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          GAMETEST_RESULT: ${{ needs.client-gametest.result }}
          COMPAT_RESULT: ${{ needs.compatibility-smoke.result }}
        run: |
          test "$PREPARE_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$GAMETEST_RESULT" = success
          test "$COMPAT_RESULT" = success
