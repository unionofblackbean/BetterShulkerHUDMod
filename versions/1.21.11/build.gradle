plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url 'https://maven.shedaniel.me' }
    maven { url 'https://maven.blamejared.com' }
    maven {
        url 'https://masa.dy.fi/maven/sakura-ryoko'
        content { includeGroupAndSubgroups 'fi.dy.masa' }
    }
    maven {
        url 'https://maven.fallenbreath.me/releases'
        content { includeGroupAndSubgroups 'me.fallenbreath' }
    }
}

configurations {
    embed
    compileOnly.extendsFrom embed
    runtimeOnly.extendsFrom embed
}

loom {
    splitEnvironmentSourceSets()
    accessWidenerPath = file("src/main/resources/better-shulker-hud.accesswidener")

    mods {
        "better-shulker-hud" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

// Use Loom's official Fabric API test lane. The previous hand-built run copied
// main/client runtime classpaths into the target classloader, duplicating Loader
// and Mixin and causing Knot/app ClassCastException before tests could start.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "better-shulker-hud-client-gametest"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

sourceSets.gametest {
    java.setSrcDirs(['src/clientGameTest/java'])
    resources.setSrcDirs(['src/clientGameTest/resources'])
    compileClasspath += sourceSets.client.output
    runtimeClasspath += sourceSets.client.output
}

loom.runs.named("clientGameTest") {
    property "fabric.client.gametest.testModResourcesPath",
            file("src/clientGameTest/resources").absolutePath
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    modCompileOnly('com.github.MoRanpcy:quickshulker:3.0.1-1.21.11') {
        transitive = false
    }
    // Optional runtime lane. Base Client GameTest deliberately excludes it.
    if (project.hasProperty('compat_quickshulker')) {
        // These are Fabric mods, not ordinary JVM libraries. Using the plain
        // gametestRuntimeOnly configuration bypasses Loom's remapper and leaves
        // QuickShulker's classTweaker in the intermediary namespace.
        modGametestRuntimeOnly('com.github.MoRanpcy:quickshulker:3.0.1-1.21.11') {
            transitive = false
        }
        modGametestRuntimeOnly('me.fallenbreath:conditional-mixin-fabric:0.6.4') {
            transitive = false
        }
    }

    modCompileOnly('me.shedaniel:RoughlyEnoughItems-api:21.11.816')
    compileOnly('mezz.jei:jei-1.21.11-common-api:27.22.0.64')

    modImplementation('fi.dy.masa.malilib:malilib-fabric-1.21.11:0.27.16') {
        exclude group: 'net.fabricmc', module: 'fabric-loader'
    }

    embed 'com.belerweb:pinyin4j:2.5.1'
    embed('com.github.Towdium:PinIn:1.6.0') {
        transitive = false
    }
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    def projectName = project.name
    inputs.property "projectName", projectName

    from("LICENSE") {
        rename { "${it}_$projectName"}
    }
    from("LICENSE-PinIn") {
        into("META-INF/licenses")
        rename { "PinIn-LICENSE.txt" }
    }

    // Embed pinyin4j classes directly (not jar-in-jar)
    from {
        configurations.embed.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }

    repositories {
    }
}
